<style>
:root {
  --bg: #faf8f4;
  --card: #ffffff;
  --ink: #1b1a17;
  --muted: #6b6357;
  --gold: #cfb991;
  --line: #e4ddd0;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #171613;
    --card: #23211d;
    --ink: #f2efe8;
    --muted: #a79c8a;
    --gold: #cfb991;
    --line: #38342c;
  }
}
* { box-sizing: border-box; }
body {
  margin: 0;
  padding: 32px 20px 64px;
  background: var(--bg);
  color: var(--ink);
  font: 17px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
}
.wrap { max-width: 760px; margin: 0 auto; }
h1 {
  font-size: 2.4rem;
  margin: 0 0 6px;
  letter-spacing: -0.02em;
}
.tagline { color: var(--muted); margin: 0 0 18px; }
#sound {
  font: inherit;
  font-size: .92rem;
  color: var(--ink);
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 7px 16px;
  cursor: pointer;
  margin-bottom: 26px;
}
#sound:hover { border-color: var(--gold); }
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 12px;
  margin-bottom: 28px;
}
button.cat {
  font: inherit;
  font-weight: 600;
  color: var(--ink);
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 16px 12px;
  cursor: pointer;
  transition: transform .08s ease, border-color .15s ease;
}
button.cat:hover { border-color: var(--gold); }
button.cat:active { transform: scale(.97); }
button.cat[aria-pressed="true"] {
  border-color: var(--gold);
  box-shadow: inset 0 0 0 2px var(--gold);
}
button.cat .emoji { display: block; font-size: 1.7rem; margin-bottom: 6px; }
#stage {
  background: var(--card);
  border: 1px solid var(--line);
  border-left: 5px solid var(--gold);
  border-radius: 12px;
  padding: 26px 24px;
  min-height: 120px;
  display: flex;
  flex-direction: column;
  justify-content: center;
}
#topic {
  font-size: .78rem;
  letter-spacing: .09em;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 10px;
}
#joke { font-size: 1.22rem; margin: 0; cursor: pointer; }
#again {
  font: inherit;
  margin-top: 20px;
  align-self: flex-start;
  background: var(--gold);
  color: #1b1a17;
  border: 0;
  border-radius: 9px;
  padding: 10px 20px;
  font-weight: 600;
  cursor: pointer;
}
#again[hidden] { display: none; }
footer { color: var(--muted); font-size: .85rem; margin-top: 34px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>The Joke Machine</h1>
  <p class="tagline">Pick a topic. Get a joke. Repeat until someone asks you to stop.</p>

  <button id="sound" type="button" aria-pressed="true">🔊 Read jokes out loud</button>

  <div class="grid" id="grid"></div>

  <div id="stage">
    <div id="topic"></div>
    <p id="joke">Pick a topic above.</p>
    <button id="again" hidden>Another one</button>
  </div>
  <p id="novoice" class="tagline" hidden>This browser cannot read text out loud.</p>

  <footer>Built for ECE 60141 Lab 1. Page generated by <code>build_site.py</code>.</footer>
</div>

<script>
const DATA = {"title": "The Joke Machine", "tagline": "Pick a topic. Get a joke. Repeat until someone asks you to stop.", "tagline_short": "Pick a topic. Get a joke.", "site_url": "https://cabouman.github.io/joke-machine/", "categories": [{"name": "Engineers", "emoji": "🔧", "jokes": ["My engineer friend built a machine that folds laundry. It takes four hours and it only works on one towel. He calls it a proof of concept. I call it a towel.", "How many engineers does it take to change a light bulb? None. They redesign the room so the bulb is never needed.", "An engineer's recipe calls for 250 grams of flour, plus or minus 3 grams. The cake still comes out wrong, but at least the error is documented.", "I asked an engineer if the bridge was safe. She said yes, with a safety factor of two. I asked what happens at a factor of one. She changed the subject.", "Engineers do not lose things. They temporarily misplace them in a location to be determined."]}, {"name": "Cats", "emoji": "🐱", "jokes": ["My cat has two settings: asleep, and deeply offended.", "I bought my cat an expensive bed. She sleeps in the box it came in. The bed is now the box's bed.", "A cat will stare at a wall for twenty minutes and then look at you like you are the strange one.", "My cat knocked a glass off the table and held eye contact the whole way down. That was not an accident. That was a demonstration.", "Dogs have owners. Cats have staff, and the staff are not doing well."]}, {"name": "Math", "emoji": "➗", "jokes": ["I told my friend a joke about an infinite series. He did not get it, but he kept getting closer.", "There are three kinds of mathematicians: those who can count, and those who cannot.", "My statistics professor said the average family has 2.3 children. I have been looking for the 0.3 child for years.", "I tried to divide by zero once. My calculator has not spoken to me since.", "Why do mathematicians like the woods? All those natural logs."]}, {"name": "Coffee", "emoji": "☕", "jokes": ["I do not have a coffee problem. I have a being-awake requirement, and coffee is the only vendor.", "My doctor said to cut back to one cup a day. I bought a bigger cup. We are both technically correct.", "The first coffee of the day is medicine. The second is enjoyment. The third is a decision I will discuss with no one.", "Decaf is just a hot brown lie.", "I measure the day in cups, not hours. Right now it is a quarter past four."]}, {"name": "Drones", "emoji": "🚁", "jokes": ["My drone has two flight modes: exactly where I pointed it, and somewhere in a tree.", "I spent six hours tuning the control loop and thirty seconds learning that a fence post is also a tuning method.", "The good news is the drone came back. The bad news is it came back in three pieces, and I only launched one.", "Every drone pilot has a tree. You do not pick the tree. The tree picks you.", "They call it a crash. I call it an unscheduled landing with enthusiastic feedback."]}, {"name": "Doctors", "emoji": "🩺", "jokes": ["I told my doctor it hurts when I do this. She said stop doing that, and charged me for the visit. Efficient.", "The waiting room is called that because it is the only part of the process they are honest about.", "My doctor said I should get more exercise. I said I would look into it. That was the exercise.", "I read my symptoms online and diagnosed myself with three rare diseases and a mild case of being fine.", "Doctors write instructions in a font that can be read by pharmacists and by no one else in recorded history."]}, {"name": "Bicycles", "emoji": "🚲", "jokes": ["The correct number of bicycles to own is one more than the number you currently own. This is a law, not an opinion.", "I bought the new bike for exercise. It has been in the garage getting stronger ever since.", "Cyclists do not get lost. We take a scenic detour that we did not plan, did not enjoy, and did not survive gracefully.", "The hill is not steep. The hill is fine. I am the problem, and I have known this since mile four.", "A headwind is a hill you cannot see and cannot photograph."]}, {"name": "Computers", "emoji": "💻", "jokes": ["My computer asked whether I wanted to restart now or later. I picked later. That was in March.", "There are two hard problems in computing: naming things, and the other one.", "I asked the AI to be concise. It wrote four paragraphs explaining why it would be concise.", "The code worked on my machine. We are shipping my machine.", "Every bug is a feature until somebody writes it down."]}]};

const grid    = document.getElementById("grid");
const topic   = document.getElementById("topic");
const joke    = document.getElementById("joke");
const again   = document.getElementById("again");
const sound   = document.getElementById("sound");
const novoice = document.getElementById("novoice");

let current = null;   // index of the selected category
let bag = [];         // jokes not yet shown for that category

// Read aloud uses the browser's built-in speech synthesis. Nothing is
// downloaded and no account is needed. Older browsers may not have it.
const canSpeak = "speechSynthesis" in window;
let speakOn = canSpeak && localStorage.getItem("speakOn") !== "no";

if (!canSpeak) {
  sound.hidden = true;
  novoice.hidden = false;
}

function drawSoundButton() {
  sound.textContent = speakOn ? "🔊 Read jokes out loud" : "🔇 Sound off";
  sound.setAttribute("aria-pressed", speakOn ? "true" : "false");
}
drawSoundButton();

function say(text) {
  if (!speakOn) return;
  speechSynthesis.cancel();            // stop whatever is still talking
  const u = new SpeechSynthesisUtterance(text);
  u.rate = 0.95;
  speechSynthesis.speak(u);
}

sound.addEventListener("click", () => {
  speakOn = !speakOn;
  localStorage.setItem("speakOn", speakOn ? "yes" : "no");
  drawSoundButton();
  if (!speakOn) speechSynthesis.cancel();
  else if (current !== null) say(joke.textContent);
});

// Clicking the joke text repeats it.
joke.addEventListener("click", () => { if (current !== null) say(joke.textContent); });

DATA.categories.forEach((cat, i) => {
  const b = document.createElement("button");
  b.className = "cat";
  b.type = "button";
  b.setAttribute("aria-pressed", "false");
  b.innerHTML = '<span class="emoji">' + cat.emoji + "</span>" + cat.name;
  b.addEventListener("click", () => pick(i));
  grid.appendChild(b);
});

// Show a joke from category i. Refill the bag when it runs out, so
// every joke is seen once before any repeats.
function pick(i) {
  if (i !== current) {
    current = i;
    bag = [];
    [...grid.children].forEach((b, k) =>
      b.setAttribute("aria-pressed", k === i ? "true" : "false"));
  }
  if (bag.length === 0) bag = DATA.categories[i].jokes.slice();
  const k = Math.floor(Math.random() * bag.length);
  const text = bag.splice(k, 1)[0];
  topic.textContent = DATA.categories[i].name;
  joke.textContent = text;
  again.hidden = false;
  say(text);
}

again.addEventListener("click", () => { if (current !== null) pick(current); });
</script>
</body>
</html>
