y cat wakes me at five in the morning to tell me that it is five in the morning.", "There is a spot on the couch that is mine and a spot that is hers, and they are the same spot.", "My cat sits beside me all evening and then acts surprised when I stand up, as though I had broken a treaty.", "I said her name and she blinked slowly. I am told that means love. It also means no."]}, {"name": "Math", "emoji": "➗", "jokes": ["I told my friend a joke about an infinite series. He did not get it, but he kept getting closer.", "There are three kinds of mathematicians: those who can count, and those who cannot.", "My statistics professor said the average family has 2.3 children. I have been looking for the 0.3 child for years.", "I tried to divide by zero once. My calculator has not spoken to me since.", "Why do mathematicians like the woods? All those natural logs.", "I asked the professor for a hint. He said the proof is left as an exercise. That was the hint.", "Two is the only even prime, which makes it both special and slightly smug.", "A topologist cannot tell a coffee cup from a doughnut, which explains the breakfast situation.", "The problem said the result follows clearly. Four hours later it was still not clear, but it had become personal.", "I love proof by contradiction. You assume the world is wrong and then you are proved right.", "Statistics says I am average. Statistics has not met me.", "The shortest distance between two points is a straight line, unless you are proving it, in which case it is eleven pages.", "I told my student the answer was trivial. He asked me to show it. I am still working on that.", "Zero is a number that took humanity several thousand years to admit was there.", "A mathematician bought six apples because the store had seven and he wanted the remainder to be interesting.", "Pi is irrational, which is the politest way anyone has described being infinitely stubborn.", "I asked what the error bars meant. She said they mean we are honest. I asked how big honest is.", "The theorem is beautiful. The proof is four hundred pages. Beautiful is doing a lot of work in that sentence.", "In theory there is no difference between theory and practice. I have stopped saying the rest of it out loud.", "My favorite number is whichever one I currently cannot prove anything about."]}, {"name": "Coffee", "emoji": "☕", "jokes": ["I do not have a coffee problem. I have a being-awake requirement, and coffee is the only vendor.", "My doctor said to cut back to one cup a day. I bought a bigger cup. We are both technically correct.", "The first coffee of the day is medicine. The second is enjoyment. The third is a decision I will discuss with no one.", "Decaf is just a hot brown lie.", "I measure the day in cups, not hours. Right now it is a quarter past four.", "The office coffee is free, which is exactly what it is worth.", "I switched to tea for a week. My colleagues held a small ceremony when I came back.", "There is a cup on my desk from Tuesday. It is not coffee anymore. It is a monument.", "I ground the beans, heated the water to the exact temperature, timed the pour, and then drank it while reading email. The email won.", "Someone asked how I take my coffee. Seriously, I said. They meant milk.", "I bought a machine with fourteen settings. I use one. I have never been happier or more embarrassed.", "The best coffee I ever had was in a paper cup at four in the morning next to something that was on fire. Context is a flavor.", "My mug says World's Okayest something. The word wore off. I have decided it applies broadly.", "I told myself I would stop after two. I now have a rule about telling myself things.", "Cold brew is what happens when patience and impatience have a child.", "There is a particular silence in a house before the first cup, and it is not peace. It is a negotiation.", "I have never once regretted making coffee. I have regretted almost everything I did afterward.", "The shop asked for a name. I gave a false one. Now a stranger's name is called and I answer to it, and that is my life.", "I drink coffee to be productive. Then I check email. Then I am neither productive nor awake, only informed.", "Somebody drank the last of the pot and did not start a new one. We do not speak of them."]}, {"name": "Drones", "emoji": "🚁", "jokes": ["My drone has two flight modes: exactly where I pointed it, and somewhere in a tree.", "I spent six hours tuning the control loop and thirty seconds learning that a fence post is also a tuning method.", "The good news is the drone came back. The bad news is it came back in three pieces, and I only launched one.", "Every drone pilot has a tree. You do not pick the tree. The tree picks you.", "They call it a crash. I call it an unscheduled landing with enthusiastic feedback.", "The manual says maintain visual line of sight. The sky disagrees. The sky wins.", "I have four batteries and the attention span of three.", "The first flight of a new build lasts either twenty minutes or four seconds, and you know which within half of the first second.", "I bought spare propellers. That was optimism dressed as preparation.", "The wind was calm on the ground. The wind was not calm at forty meters. Nobody told the drone in advance.", "I named it after a bird. It has never flown like a bird. It has flown like a thrown chair.", "There is a moment between losing control and admitting you have lost control, and I have spent a lot of my life in that moment.", "The failsafe worked exactly as designed. The design was mine. That is the whole story.", "I told my neighbor it was a research project. I was on my knees in his hedge at the time.", "The best landing is the one where you pick up all the parts in a single trip.", "I spent more on the camera than on the aircraft, and I have watched the crash forty times in very high definition.", "Range test complete. The range is exactly as far as I could still see it and not one meter farther.", "It is never the soldering. It has never once been the soldering. I check the soldering first every time.", "Somewhere out there is a field with a small part of my drone in it, and it is happier than I am.", "They asked whether it was hard to learn. I said no, it is expensive to learn, which is a different thing."]}, {"name": "Doctors", "emoji": "🩺", "jokes": ["I told my doctor it hurts when I do this. She said stop doing that, and charged me for the visit. Efficient.", "The waiting room is called that because it is the only part of the process they are honest about.", "My doctor said I should get more exercise. I said I would look into it. That was the exercise.", "I read my symptoms online and diagnosed myself with three rare diseases and a mild case of being fine.", "Doctors write instructions in a font that can be read by pharmacists and by no one else in recorded history.", "The form asked me to rate my pain from one to ten. I said six. She wrote down four. We are negotiating.", "My doctor asked whether I had been under stress. I laughed for some time and she wrote that down too.", "I told him I only drink socially. He asked how social I am. I said increasingly.", "The appointment was at two. I was seen at three and given eight minutes. Arithmetically we are even.", "The nurse said this might pinch. That word is doing a great deal of work.", "I asked whether the results were bad. She said they were interesting. That is worse.", "Nothing makes you feel healthier than a waiting room full of people who are not.", "He told me to lose ten pounds. I told him I would. We both knew. It was a moment of shared understanding.", "The pharmacy called to say my prescription is ready. It has been ready for nine days. So have I, on and off.", "My doctor is younger than me now. That seems to have happened all at once.", "I described the symptom for two minutes. She said hm. I would like to know what hm costs.", "The label said take with food. I took it with an entire cake. I feel the label was vague.", "I went in for one thing and left with three referrals, which is either thorough medicine or a very good business.", "The scale at the doctor's office reads four pounds heavier than the one at home. One of them is lying and I know which one I prefer.", "She asked whether I had any questions. I had eleven. I asked none. I remembered all of them in the parking lot."]}, {"name": "Bicycles", "emoji": "🚲", "jokes": ["The correct number of bicycles to own is one more than the number you currently own. This is a law, not an opinion.", "I bought the new bike for exercise. It has been in the garage getting stronger ever since.", "Cyclists do not get lost. We take a scenic detour that we did not plan, did not enjoy, and did not survive gracefully.", "The hill is not steep. The hill is fine. I am the problem, and I have known this since mile four.", "A headwind is a hill you cannot see and cannot photograph.", "I spent an hour choosing a route and forty minutes riding it.", "The wind was behind me for the first ten miles, which is the cruelest gift there is.", "A dog chased me for a hundred meters and set my personal record on that stretch. I have not thanked him.", "I told myself I would take it easy today. Then somebody passed me.", "The computer says I climbed two thousand feet. My legs say more. I believe my legs.", "There are two kinds of rides: the ones where you feel strong, and the ones you talk about more.", "I stopped for a photograph. That is what I said. I stopped.", "Every route has one road that looked fine on the map and is not fine.", "A flat tire twenty miles out is not a problem. It is a story that has not finished forming.", "I carry a pump, a spare tube, and tire levers. I have used all three, in the wrong order, in the rain.", "The last three miles home are uphill regardless of the terrain.", "I waved at another cyclist and he did not wave back. I have thought about this several times since.", "Coffee at mile thirty is not a break. It is the reason.", "My computer said I was averaging fifteen. I checked it eleven times. It did not improve, but I did check.", "The bike is fine. The bike is always fine. It is the engine that needs work."]}, {"name": "Computers", "emoji": "💻", "jokes": ["My computer asked whether I wanted to restart now or later. I picked later. That was in March.", "There are two hard problems in computing: naming things, and the other one.", "I asked the AI to be concise. It wrote four paragraphs explaining why it would be concise.", "The code worked on my machine. We are shipping my machine.", "Every bug is a feature until somebody writes it down.", "I turned it off and on again and it worked, and now I have to live with that.", "The error message said an error occurred. I am grateful for the confirmation.", "I wrote a comment explaining the tricky part. Six months later the comment explained nothing, and it was smug about it.", "The backup has run every night for two years. The restore has never been tested. We are all very brave.", "I refactored it for clarity and now nobody can find anything, including clarity.", "The password must contain a capital letter, a number, a symbol, and a memory you no longer have.", "It is not slow. It is thoughtful.", "The update fixed three bugs and added a fourth, which is progress if you do not count.", "I spent two hours automating a task that takes four minutes. I will do that task eleven more times in my life. I regret nothing.", "The documentation is excellent and describes a version that no longer exists.", "I asked the AI for a short answer. It apologized at length.", "I have 847 browser tabs open, and each one is a decision I declined to make.", "The bug only happens in production, at night, when nobody is watching. That is either a race condition or a personality.", "Someone asked what the code does. I said it works. They asked again. I said it has always worked.", "The best variable name I ever wrote was temp, and it is still in production, and it is not temporary."]}]};

const grid    = document.getElementById("grid");
const topic   = document.getElementById("topic");
const joke    = document.getElementById("joke");
const again   = document.getElementById("again");
const sound   = document.getElementById("sound");
const novoice = document.getElementById("novoice");

let current = null;   // index of the selected category

// One bag of unseen jokes per topic, kept in the browser so that
// switching topics or closing the tab does not bring jokes back.
// A bag holds positions into that topic's joke list.
const BAGS_KEY = "jokeBags.v1";
let bags = loadBags();

function loadBags() {
  try {
    const saved = JSON.parse(localStorage.getItem(BAGS_KEY) || "{}");
    return (saved && typeof saved === "object") ? saved : {};
  } catch (e) {
    return {};
  }
}

function saveBags() {
  try { localStorage.setItem(BAGS_KEY, JSON.stringify(bags)); } catch (e) {}
}

// Unseen jokes for a topic. Refills once every joke has been shown.
// Positions past the end are dropped, so editing jokes.json is safe.
function bagFor(cat) {
  let bag = bags[cat.name];
  if (!Array.isArray(bag)) bag = null;
  if (bag) bag = bag.filter(n => Number.isInteger(n) && n >= 0 && n < cat.jokes.length);
  if (!bag || bag.length === 0) bag = cat.jokes.map((_, n) => n);
  return bag;
}

// Read aloud uses the browser's built-in speech synthesis. Nothing is
// downloaded and no account is needed. Older browsers may not have it.
const canSpeak = "speechSynthesis" in window;
let speakOn = canSpeak && localStorage.getItem("speakOn") !== "no";

if (!canSpeak) {
  sound.hidden = true;
  novoice.hidden = false;
}

function drawSoundButton() {
  sound.textContent = speakOn ? "🔊 Read jokes out loud" : "🔇 Sound off";
  sound.setAttribute("aria-pressed", speakOn ? "true" : "false");
}
drawSoundButton();

function say(text) {
  if (!speakOn) return;
  speechSynthesis.cancel();            // stop whatever is still talking
  const u = new SpeechSynthesisUtterance(text);
  u.rate = 0.95;
  speechSynthesis.speak(u);
}

sound.addEventListener("click", () => {
  speakOn = !speakOn;
  localStorage.setItem("speakOn", speakOn ? "yes" : "no");
  drawSoundButton();
  if (!speakOn) speechSynthesis.cancel();
  else if (current !== null) say(joke.textContent);
});

// Clicking the joke text repeats it.
joke.addEventListener("click", () => { if (current !== null) say(joke.textContent); });

DATA.categories.forEach((cat, i) => {
  const b = document.createElement("button");
  b.className = "cat";
  b.type = "button";
  b.setAttribute("aria-pressed", "false");
  b.innerHTML = '<span class="emoji">' + cat.emoji + "</span>" + cat.name;
  b.addEventListener("click", () => pick(i));
  grid.appendChild(b);
});

// Show an unseen joke from category i.
function pick(i) {
  const cat = DATA.categories[i];

  if (i !== current) {
    current = i;
    [...grid.children].forEach((b, k) =>
      b.setAttribute("aria-pressed", k === i ? "true" : "false"));
  }

  const bag = bagFor(cat);
  const k = Math.floor(Math.random() * bag.length);
  const text = cat.jokes[bag.splice(k, 1)[0]];

  bags[cat.name] = bag;
  saveBags();

  const left = bag.length;
  topic.textContent = left > 0
    ? cat.name + " · " + left + " more before any repeat"
    : cat.name + " · that was the last new one";
  joke.textContent = text;
  again.hidden = false;
  say(text);
}

again.addEventListener("click", () => { if (current !== null) pick(current); });
</script>
