name: Deploy to Hugging Face Space

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update the Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git clone "https://cabouman:$HF_TOKEN@huggingface.co/spaces/cabouman/joke-machine" space
          cp .hf/README.md space/README.md
          cp docs/index.html docs/favicon.png docs/preview.png docs/icon.png space/
          cd space
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to deploy."
          else
            git commit -m "Deploy from GitHub commit $GITHUB_SHA"
            git push
          fi
